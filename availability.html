<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camper Availability – Happy Hooker Rentals</title>

  <!-- ✅ FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

  <!-- ✅ Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background: #f8f9fa;
      font-family: system-ui, -apple-system, Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #004aad;
      color: white;
      text-align: center;
      padding: 1rem;
    }

    .back-container {
      text-align: center;
      margin: 1rem 0;
    }

    .go-back-btn {
      background-color: #28a745;
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease-in-out;
    }

    .go-back-btn:hover {
      background-color: #218838;
    }

    #calendar {
      max-width: 900px;
      margin: 1rem auto 2rem;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 0.5rem;
    }

    @media (max-width: 768px) {
      header h3 {
        font-size: 1.1rem;
      }
      .go-back-btn {
        padding: 8px 14px;
        font-size: 0.9rem;
      }
      #calendar {
        width: 95%;
        padding: 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <h3 id="calendarTitle">Camper Availability</h3>
  </header>

  <div class="back-container">
    <button class="go-back-btn" id="goBackButton" type="button">← Go Back and Request Quote</button>
  </div>

  <div id="availabilityStatus" class="container text-center" role="status"></div>
  <div id="calendar"></div>

  <script src="metadata.js"></script>
  <script>
    "use strict";

    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const camperKey = params.get("camper") || "";
      const backendUrl = "https://script.google.com/macros/s/AKfycbz_sagf02qOlIKf2eGC7an1sq9bqbLgEx03G890blnLMERuITbvFXYD2W556r_iI2E/exec";
      const status = document.getElementById("availabilityStatus");

      try {
        const metadata = await HHRMetadata.load();
        const camper = HHRMetadata.getCamperByWebsiteKey(metadata, camperKey);
        const isRentable = camper && camper.status.active && camper.status.rentable && camper.website.rentalVisible;
        if (!isRentable) throw new Error("The selected camper is not currently available for rent.");

        document.getElementById("calendarTitle").textContent = `Availability for ${camper.fullName} (sleeps ${camper.details.sleeps})`;
        document.getElementById("goBackButton").addEventListener("click", () => {
          window.location.href = camper.website.quotePath;
        });

        const response = await fetch(`${backendUrl}?camper=${encodeURIComponent(camper.websiteKey)}`, {
          headers: { Accept: "application/json" }
        });
        if (!response.ok) throw new Error(`Availability service returned ${response.status}.`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("Availability service returned an invalid response.");

        // Add static unavailable dates (Nov–Apr)
        const staticUnavailable = [];
        const currentYear = new Date().getFullYear();
        for (let y = currentYear; y <= currentYear + 2; y++) {
          staticUnavailable.push({
            title: "Not Available",
            start: `${y}-11-01`,
            end: `${y + 1}-05-01`,
            color: "gray",
          });
        }

        // Format events (no description used)
        const formattedEvents = data.map(ev => {
          const eventTitle = String(ev.title || "");
          const eventLocation = String(ev.location || "");
          const shortLoc = eventLocation ? eventLocation.split(",")[0] : "";
		  const lowerTitle = eventTitle.toLowerCase();
          const title = lowerTitle.includes("blocked") || lowerTitle.includes("hold") || !eventLocation
            ? `Not Available${shortLoc ? " @" + shortLoc : ""}`
            : `Booked${shortLoc ? " @" + shortLoc : ""}`;

          return {
            title,
            start: ev.start,
            end: ev.end,
            color: eventTitle.includes("Blocked") ? "gray" : "red",
            allDay: true,
            extendedProps: {
              fullLocation: eventLocation
            },
          };
        });

        const allEvents = [...formattedEvents, ...staticUnavailable];

        // Initialize FullCalendar
        const calendarEl = document.getElementById("calendar");
        const calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: "dayGridMonth",
          height: "auto",
          displayEventTime: false,  // Removes "12a"
          events: allEvents,
          eventDidMount: info => {
            const { fullLocation } = info.event.extendedProps;
            if (fullLocation) {
              new bootstrap.Tooltip(info.el, {
                title: fullLocation,
                html: false,
                placement: "top",
              });
            }
          },
        });

        calendar.render();
      } catch (err) {
        console.error("Error loading events:", err);
        status.textContent = err.message || "Availability is temporarily unavailable.";
        document.getElementById("goBackButton").addEventListener("click", () => {
          window.location.href = "index.html";
        }, { once: true });
      }
    });
  </script>
</body>
</html>
